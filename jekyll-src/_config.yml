title: "AI Practitioner"
author: "John Michael Miller"
email: "AIPractitioner@pdata.com"
description: "jMM's AI Practitioner Blog"
permalink: /:title/
lang: "en"
excerpt_separator: "<!--more-->"
date_format: "%B %d, %Y"
baseurl: ""
url: "https://blog.pdata.com"
theme: minima
markdown: kramdown
plugins:
  - jekyll-feed

sass:
  quiet_deps: true
  style: compressed
  silence_deprecations:
    - import

# Layout

show_excerpts: true # show article excerpts instead of archive list on the home page
show_frame: true # display a grey frame on large screens
show_sidebar: false # show a sidebar instead of the usual header
show_minimal: false # remove all clutter

# Menu                          # for available icons see https://fontawesome.com/v5/icons/

navigation: # accepts {file, title, url, icon, sidebaricon}
  - { file: "archive.html", sidebaricon: home }
  - { file: "README.md", sidebaricon: address-card }

external: # accepts {file, title, url, icon, sidebaricon}
  - { title: Mail, icon: envelope, url: "mailto:AIP@pdata.com" }
  - { title: Github, icon: github, url: "https://github.com/" }
  - { title: Subscribe, icon: rss, url: "/feed.xml" }

comments:
  giscus:
    enabled: true
    repo: "JohnMichaelMiller/AI-Practitioner"
    repo_id: "1138527485"
    category: "General"
    category_id: "" # optional; leave blank to use the category name above
    mapping: "pathname"
    strict: "0"
    reactions_enabled: "1"
    emit_metadata: "0"
    input_position: "bottom"
    theme: "preferred_color_scheme"
    lang: "en"
#  disqus_shortname: ""         # see https://disqus.com
#  isso_domain: ""              # see https://isso-comments.de
